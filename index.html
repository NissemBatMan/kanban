<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Fast, offline-first Kanban board: drag & drop, keyboard moves, search, priorities and dark mode." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='8' y='7' width='4' height='18' rx='2' fill='white'/%3E%3Crect x='14' y='7' width='4' height='12' rx='2' fill='white' opacity='.8'/%3E%3Crect x='20' y='7' width='4' height='8' rx='2' fill='white' opacity='.6'/%3E%3C/svg%3E" />
    <title>Kanban</title>
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        var t = localStorage.getItem("kanban:theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
